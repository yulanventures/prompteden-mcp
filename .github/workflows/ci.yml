name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node dist/index.mjs --help
      - run: node smoke.mjs
      - run: node scripts/tools-table.mjs --check
      - run: npm run mcpb
      - run: npm pack --dry-run
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: prompteden-mcp.mcpb
          path: build/*.mcpb
          if-no-files-found: error
