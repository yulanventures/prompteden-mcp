name: Publish

on:
  workflow_dispatch:

env:
  EXPECTED_VERSION: "0.3.0"
  REVIEWED_BASE: "2ce401f4cf9938576ca4f8311b9eda75a2ff207b"
  # mcp-publisher_linux_amd64.tar.gz from modelcontextprotocol/registry v1.8.1
  # registry_1.8.1_checksums.txt (official GitHub release asset).
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Require main branch
        env:
          REF_NAME: ${{ github.ref }}
        run: |
          if [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "Publish is only allowed from refs/heads/main (got $REF_NAME)"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert reviewed package tree
        env:
          REVIEWED_BASE: ${{ env.REVIEWED_BASE }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git diff --quiet "$REVIEWED_BASE" "$GITHUB_SHA" -- . ':(exclude).github'; then
            echo "Package tree differs from reviewed commit $REVIEWED_BASE outside .github"
            git diff --stat "$REVIEWED_BASE" "$GITHUB_SHA" -- . ':(exclude).github'
            exit 1
          fi

      - name: Verify versions and remote tag
        env:
          EXPECTED_VERSION: ${{ env.EXPECTED_VERSION }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          PACKAGE_ENTRY_VERSION="$(node -p "require('./server.json').packages[0].version")"
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ] || \
             [ "$SERVER_VERSION" != "$EXPECTED_VERSION" ] || \
             [ "$PACKAGE_ENTRY_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION server.json=$SERVER_VERSION packages[0]=$PACKAGE_ENTRY_VERSION expected=$EXPECTED_VERSION"
            exit 1
          fi
          TAG="v${EXPECTED_VERSION}"
          PEELED_TAG="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
          PLAIN_TAG="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
          if [ -n "$PEELED_TAG" ]; then
            REMOTE_TAG="$PEELED_TAG"
          elif [ -n "$PLAIN_TAG" ]; then
            REMOTE_TAG="$PLAIN_TAG"
          else
            REMOTE_TAG=""
          fi
          if [ -n "$REMOTE_TAG" ] && [ "$REMOTE_TAG" != "$GITHUB_SHA" ]; then
            echo "Remote tag $TAG points to $REMOTE_TAG, expected $GITHUB_SHA"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Pack, allowlist, and content gate
        id: pack
        env:
          EXPECTED_VERSION: ${{ env.EXPECTED_VERSION }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1; then
            echo "ripgrep (rg) is required for the content gate"
            exit 1
          fi
          ALLOWED_FILES="LICENSE
          README.md
          dist/index.mjs
          package.json"
          PACKED_FILES="$(npm pack --dry-run --json --ignore-scripts | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const entry = Array.isArray(data) ? data[0] : data;
            for (const file of entry.files) {
              console.log(file.path.replace(/^package\//, ""));
            }
          ' | sort)"
          EXPECTED_SORTED="$(printf '%s\n' "$ALLOWED_FILES" | sort)"
          if [ "$PACKED_FILES" != "$EXPECTED_SORTED" ]; then
            echo "Tarball file list does not match allowlist"
            echo "expected:"
            printf '%s\n' "$EXPECTED_SORTED"
            echo "actual:"
            printf '%s\n' "$PACKED_FILES"
            exit 1
          fi
          npm pack --ignore-scripts
          TARBALL="$(find . -maxdepth 1 -name '*.tgz' -printf '%f\n' | head -n 1)"
          test -n "$TARBALL"
          DIST_SHA256="$(sha256sum dist/index.mjs | awk '{print $1}')"
          printf '%s\n' "$DIST_SHA256" > prompteden-mcp.mjs.sha256
          CHECKSUM_FILE_SHA256="$(sha256sum prompteden-mcp.mjs.sha256 | awk '{print $1}')"
          TARBALL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w 0)"
          TARBALL_SHA256="$(sha256sum "$TARBALL" | awk '{print $1}')"
          UNPACK_DIR="$(mktemp -d)"
          tar -xzf "$TARBALL" -C "$UNPACK_DIR"
          SCAN_ROOT="$UNPACK_DIR/package"
          SCAN_WORK="$(mktemp -d)"
          cp "$SCAN_ROOT/LICENSE" "$SCAN_WORK/LICENSE"
          cp "$SCAN_ROOT/README.md" "$SCAN_WORK/README.md"
          cp "$SCAN_ROOT/package.json" "$SCAN_WORK/package.json"
          cp "$SCAN_ROOT/dist/index.mjs" "$SCAN_WORK/dist.index.mjs"
          count_literal() {
            local file="$1"
            local literal="$2"
            python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text().count(sys.argv[2]))' "$file" "$literal"
          }
          scrub_literal() {
            local file="$1"
            local literal="$2"
            local expected="$3"
            local actual
            actual="$(count_literal "$file" "$literal")"
            if [ "$actual" != "$expected" ]; then
              echo "Harness scrub count mismatch in $(basename "$file"): expected $expected of '$literal', found $actual"
              exit 1
            fi
            if [ "$expected" -gt 0 ]; then
              python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); p.write_text(p.read_text().replace(sys.argv[2], ""))' "$file" "$literal"
              if [ "$(count_literal "$file" "$literal")" -ne 0 ]; then
                echo "Harness scrub failed to remove all occurrences of '$literal' from $(basename "$file")"
                exit 1
              fi
            fi
          }
          # Full exact filter literals from dist/index.mjs (monitor-providers bundle).
          scrub_literal "$SCAN_WORK/dist.index.mjs" 'category === "agent coding harnesses"' 1
          scrub_literal "$SCAN_WORK/dist.index.mjs" 'category.includes("harness")' 1
          scrub_literal "$SCAN_WORK/dist.index.mjs" 'text.includes("coding harness")' 1
          scrub_literal "$SCAN_WORK/dist.index.mjs" 'text.includes("agent harness")' 1
          # README.md has no harness-filter literals; assert none of the bundle literals appear.
          scrub_literal "$SCAN_WORK/README.md" 'category === "agent coding harnesses"' 0
          scrub_literal "$SCAN_WORK/README.md" 'category.includes("harness")' 0
          scrub_literal "$SCAN_WORK/README.md" 'text.includes("coding harness")' 0
          scrub_literal "$SCAN_WORK/README.md" 'text.includes("agent harness")' 0
          SCAN_FILES=(
            "$SCAN_WORK/LICENSE"
            "$SCAN_WORK/README.md"
            "$SCAN_WORK/package.json"
            "$SCAN_WORK/dist.index.mjs"
          )
          PATTERNS=(
            'content_'
            'article_'
            'newsroom'
            'create_content'
            'generate_content'
            'update_content'
            'publish_content'
            'list_content'
            'preview_displacement'
            'displacement'
            'check_approval'
            'agent_sign_up'
            'agent_sign_in'
            'harness_run'
            'harness'
            'Wells'
            'approval'
            'staging'
            '/Users/'
            '/private/tmp'
            '/home/'
            'op://'
            'npm_[A-Za-z0-9]{20,}'
            'gh[pousr]_[A-Za-z0-9]{20,}'
            'sk-[A-Za-z0-9]{20,}'
            'pe_[A-Za-z0-9]{20,}'
            'AKIA[0-9A-Z]{16}'
            '-----BEGIN'
          )
          CONTENT_SCAN_FOUND=0
          content_scan() {
            local file="$1"
            local rel="$2"
            local pat="$3"
            local counts
            local rc
            set +e
            counts="$(rg -i -c -e "$pat" -- "$file")"
            rc=$?
            set -e
            case "$rc" in
              0)
                while IFS= read -r line; do
                  local count="${line##*:}"
                  if [ "$count" -gt 0 ]; then
                    echo "$rel: $count matches"
                    CONTENT_SCAN_FOUND=1
                  fi
                done <<< "$counts"
                ;;
              1)
                ;;
              *)
                echo "rg failed for $rel with pattern $pat"
                echo "$counts"
                exit 1
                ;;
            esac
          }
          run_content_scan() {
            local file="$1"
            local rel="$2"
            local pat
            for pat in "${PATTERNS[@]}"; do
              content_scan "$file" "$rel" "$pat"
            done
          }
          SELF_TEST_DIR="$(mktemp -d)"
          printf '%s\n' \
            '-----BEGIN PRIVATE KEY-----' \
            'server.registerTool("harness_execute", { description: "coding harness" }, execute);' \
            'server.registerTool("run_probe", { description: "coding harness" }, execute);' \
            > "$SELF_TEST_DIR/probe.txt"
          SELF_TEST_HITS=0
          for SELF_PAT in '-----BEGIN' 'harness_execute' 'run_probe'; do
            set +e
            rg -i -e "$SELF_PAT" -- "$SELF_TEST_DIR/probe.txt" >/dev/null
            SELF_RC=$?
            set -e
            case "$SELF_RC" in
              0) SELF_TEST_HITS=$((SELF_TEST_HITS + 1));;
              1) ;;
              *)
                echo "rg self-test failed for pattern $SELF_PAT"
                exit 1
                ;;
            esac
          done
          if [ "$SELF_TEST_HITS" -ne 3 ]; then
            echo "Content gate self-test failed: expected 3 planted matches, got $SELF_TEST_HITS"
            exit 1
          fi
          CONTENT_SCAN_FOUND=0
          run_content_scan "$SELF_TEST_DIR/probe.txt" "probe.txt"
          if [ "$CONTENT_SCAN_FOUND" -ne 1 ]; then
            echo "Content gate self-test failed: scanner did not flag planted probe.txt"
            exit 1
          fi
          CONTENT_SCAN_FOUND=0
          for SCAN_FILE in "${SCAN_FILES[@]}"; do
            run_content_scan "$SCAN_FILE" "$(basename "$SCAN_FILE")"
          done
          if [ "$CONTENT_SCAN_FOUND" -eq 1 ]; then
            echo "Forbidden content detected in packed artifacts"
            exit 1
          fi
          {
            echo "## dist/index.mjs sha256"
            echo '```'
            echo "$DIST_SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "tarball=$TARBALL"
            echo "tarball_integrity=$TARBALL_INTEGRITY"
            echo "dist_sha256=$DIST_SHA256"
            echo "tarball_sha256=$TARBALL_SHA256"
            echo "checksum_file_sha256=$CHECKSUM_FILE_SHA256"
            echo "commit=$GITHUB_SHA"
            echo "tag=v${EXPECTED_VERSION}"
            echo "version=$EXPECTED_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Publish package to npm
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TARBALL_INTEGRITY: ${{ steps.pack.outputs.tarball_integrity }}
          VERSION: ${{ steps.pack.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NPM_VIEW_ERR="$(mktemp)"
          if PUBLISHED_INTEGRITY="$(npm view "@prompteden/mcp-server@${VERSION}" dist.integrity 2>"$NPM_VIEW_ERR")"; then
            if [ "$PUBLISHED_INTEGRITY" = "$TARBALL_INTEGRITY" ]; then
              echo "Skipping npm publish: version ${VERSION} already published with matching integrity"
            else
              echo "npm version ${VERSION} exists but integrity mismatch"
              echo "published: $PUBLISHED_INTEGRITY"
              echo "built:     $TARBALL_INTEGRITY"
              exit 1
            fi
          else
            if grep -qiE '404|not found|E404|No match found' "$NPM_VIEW_ERR"; then
              npm publish "$TARBALL" --provenance --access public
            else
              cat "$NPM_VIEW_ERR"
              exit 1
            fi
          fi

      - name: Create GitHub release
        env:
          TAG: ${{ steps.pack.outputs.tag }}
          GITHUB_SHA: ${{ steps.pack.outputs.commit }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_SHA256: ${{ steps.pack.outputs.dist_sha256 }}
          TARBALL_SHA256: ${{ steps.pack.outputs.tarball_sha256 }}
          CHECKSUM_FILE_SHA256: ${{ steps.pack.outputs.checksum_file_sha256 }}
          VERSION: ${{ steps.pack.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_release_assets() {
            local dl_dir="$1"
            local index_path="$dl_dir/index.mjs"
            local checksum_path="$dl_dir/prompteden-mcp.mjs.sha256"
            local tarball_path="$dl_dir/$TARBALL"
            if [ ! -f "$index_path" ] || [ ! -f "$checksum_path" ] || [ ! -f "$tarball_path" ]; then
              echo "Release asset download incomplete"
              exit 1
            fi
            local released_index_sha
            released_index_sha="$(sha256sum "$index_path" | awk '{print $1}')"
            if [ "$released_index_sha" != "$DIST_SHA256" ]; then
              echo "Release asset index.mjs hash mismatch"
              exit 1
            fi
            local parsed_checksum
            parsed_checksum="$(tr -d '[:space:]' < "$checksum_path")"
            if [ "$parsed_checksum" != "$DIST_SHA256" ]; then
              echo "Release asset prompteden-mcp.mjs.sha256 contents mismatch"
              exit 1
            fi
            local released_checksum_file_sha
            released_checksum_file_sha="$(sha256sum "$checksum_path" | awk '{print $1}')"
            if [ "$released_checksum_file_sha" != "$CHECKSUM_FILE_SHA256" ]; then
              echo "Release asset prompteden-mcp.mjs.sha256 file hash mismatch"
              exit 1
            fi
            local released_tarball_sha
            released_tarball_sha="$(sha256sum "$tarball_path" | awk '{print $1}')"
            if [ "$released_tarball_sha" != "$TARBALL_SHA256" ]; then
              echo "Release asset tarball hash mismatch"
              exit 1
            fi
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            DL_DIR="$(mktemp -d)"
            gh release download "$TAG" -D "$DL_DIR" || true
            INDEX_PATH="$DL_DIR/index.mjs"
            CHECKSUM_PATH="$DL_DIR/prompteden-mcp.mjs.sha256"
            TARBALL_PATH="$DL_DIR/$TARBALL"
            if [ -f "$INDEX_PATH" ]; then
              RELEASED_INDEX_SHA="$(sha256sum "$INDEX_PATH" | awk '{print $1}')"
              if [ "$RELEASED_INDEX_SHA" != "$DIST_SHA256" ]; then
                echo "Release asset index.mjs hash mismatch"
                exit 1
              fi
            else
              gh release upload "$TAG" dist/index.mjs
            fi
            if [ -f "$CHECKSUM_PATH" ]; then
              PARSED_CHECKSUM="$(tr -d '[:space:]' < "$CHECKSUM_PATH")"
              if [ "$PARSED_CHECKSUM" != "$DIST_SHA256" ]; then
                echo "Release asset prompteden-mcp.mjs.sha256 contents mismatch"
                exit 1
              fi
              RELEASED_CHECKSUM_FILE_SHA="$(sha256sum "$CHECKSUM_PATH" | awk '{print $1}')"
              if [ "$RELEASED_CHECKSUM_FILE_SHA" != "$CHECKSUM_FILE_SHA256" ]; then
                echo "Release asset prompteden-mcp.mjs.sha256 file hash mismatch"
                exit 1
              fi
            else
              gh release upload "$TAG" prompteden-mcp.mjs.sha256
            fi
            if [ -f "$TARBALL_PATH" ]; then
              RELEASED_TARBALL_SHA="$(sha256sum "$TARBALL_PATH" | awk '{print $1}')"
              if [ "$RELEASED_TARBALL_SHA" != "$TARBALL_SHA256" ]; then
                echo "Release asset tarball hash mismatch"
                exit 1
              fi
            else
              gh release upload "$TAG" "$TARBALL"
            fi
            VERIFY_DIR="$(mktemp -d)"
            gh release download "$TAG" -D "$VERIFY_DIR"
            verify_release_assets "$VERIFY_DIR"
            echo "Release $TAG verified with matching asset checksums"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Release ${TAG} of @prompteden/mcp-server (built from ${GITHUB_SHA})." \
              dist/index.mjs \
              prompteden-mcp.mjs.sha256 \
              "$TARBALL"
          fi

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_SHA256: ${{ env.MCP_PUBLISHER_SHA256 }}
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  mcp-publisher.tar.gz\n' "$MCP_PUBLISHER_SHA256" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
